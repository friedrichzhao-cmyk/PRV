<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truth Global</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&family=Source+Serif+4:wght@500;600&display=swap">
<style>
/* Layout (time filters added 24 Oct 2026 evening, Bangkok): header, then globe and 3D die side by side as one instrument deck, then reading cards that carry English, German and Chinese together with a small topic icon, then a folded source row. Six topic hues and four region hues carry the colour; neutrals stay cool slate. */
:root {
  --bg: #E6EBEF;
  --surface: #F6F8FA;
  --ink: #1B2833;
  --mute: #566673;
  --line: #C9D3DB;
  --chip: #D8E0E6;
  --accent: #2C5C61;
  --blue: #1D4F91;
  --green: #2E6B47;
  --on-green: #FFFFFF;
  --on-c: #FFFFFF;
  --ocean: #D3E3EE;
  --c-US: #3A5FA8;
  --c-GP: #7A4FA3;
  --c-FIN: #2E8050;
  --c-TEC: #B26A00;
  --c-CN: #C23A33;
  --c-ME: #1E8189;
  --c-JOB: #6E7B1F;
  --c-GER: #3F4650;
  --c-EU: #0F73B5;
  --c-KEYS: #A67C00;
  --c-FAITH: #B03A7A;
  --c-NATURE: #8A5A3B;
  --r-AME: #D9603B;
  --r-EUR: #4A5BCF;
  --r-MEA: #C99A1B;
  --r-ASIA: #1F9A73;
  --f-disp: "Source Serif 4", "Noto Serif SC", Georgia, serif;
  --f-body: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181D; --surface: #1A2329; --ink: #E5EAEE; --mute: #94A1AB; --line: #2B363D; --chip: #232F36; --accent: #86BAB7; --blue: #7FB0EA; --green: #6DBA89; --on-green: #0F1A14; --on-c: #11181D; --ocean: #172530;
    --c-US: #86A9EE; --c-GP: #BE9CE8; --c-FIN: #78CB98; --c-TEC: #F2B55C; --c-CN: #F28C82; --c-ME: #6FD0D8; --c-FAITH: #E88FBF; --c-NATURE: #D1A07C; --c-JOB: #C9D45A; --c-GER: #B7BEC8; --c-EU: #6FB8E8; --c-KEYS: #E3C45A;
    --r-AME: #F08B68; --r-EUR: #8D9AF2; --r-MEA: #E6BD4F; --r-ASIA: #5AD1A8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181D; --surface: #1A2329; --ink: #E5EAEE; --mute: #94A1AB; --line: #2B363D; --chip: #232F36; --accent: #86BAB7; --blue: #7FB0EA; --green: #6DBA89; --on-green: #0F1A14; --on-c: #11181D; --ocean: #172530;
  --c-US: #86A9EE; --c-GP: #BE9CE8; --c-FIN: #78CB98; --c-TEC: #F2B55C; --c-CN: #F28C82; --c-ME: #6FD0D8; --c-FAITH: #E88FBF; --c-NATURE: #D1A07C; --c-JOB: #C9D45A; --c-GER: #B7BEC8; --c-EU: #6FB8E8; --c-KEYS: #E3C45A;
  --r-AME: #F08B68; --r-EUR: #8D9AF2; --r-MEA: #E6BD4F; --r-ASIA: #5AD1A8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
:lang(zh) { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", var(--f-body); }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
.brand { min-width: 0; flex: 1 1 380px; }
.brand h1 { margin: 0; color: var(--blue); font-family: var(--f-disp); font-weight: 600; font-size: clamp(34px, 5.5vw, 54px); line-height: 1.05; letter-spacing: -0.01em; text-wrap: balance; }
.brand p { margin: 10px 0 0; max-width: 40em; color: var(--mute); font-size: 14px; display: grid; gap: 1px; }
.tools { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; flex: 0 1 490px; margin-left: auto; }
.tools .ed { flex: 0 0 100%; }
.qbox { width: 200px !important; }
.seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--mute); }
.seg button[aria-pressed="true"] { background: var(--green); color: var(--on-green); }
.ed { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--mute); text-align: right; display: grid; gap: 1px; }
.strip { height: 5px; border-radius: 3px; margin-top: 20px; background: linear-gradient(90deg, var(--c-US) 0.000% 8.333%, var(--c-GP) 8.333% 16.667%, var(--c-FIN) 16.667% 25.000%, var(--c-TEC) 25.000% 33.333%, var(--c-CN) 33.333% 41.667%, var(--c-ME) 41.667% 50.000%, var(--c-FAITH) 50.000% 58.333%, var(--c-NATURE) 58.333% 66.667%, var(--c-JOB) 66.667% 75.000%, var(--c-GER) 75.000% 83.333%, var(--c-EU) 83.333% 91.667%, var(--c-KEYS) 91.667% 100.000%); }

.deck { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding-top: 22px; }
.panel { --c: var(--accent); display: flex; flex-direction: column; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; text-align: center; }
.pvis { margin: 0 auto; flex: 0 1 auto; max-width: 100%; display: grid; justify-items: center; gap: 14px; }
.pctl { width: 100%; min-width: 0; display: grid; gap: 6px; justify-items: center; }
.ph { margin-bottom: 8px; }
.ph h2 { margin: 0; font-family: var(--f-disp); font-weight: 600; font-size: 24px; line-height: 1.15; }
.ph h2 small { font-family: var(--f-body); font-weight: 500; font-size: 15px; color: var(--mute); margin-left: 6px; }
.ph p { margin: 2px 0 0; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.04em; color: var(--mute); }
.globe { display: block; width: min(100%, 380px); height: auto; aspect-ratio: 1; cursor: grab; touch-action: pan-y; }
.globe:active { cursor: grabbing; }
.hint { margin: 0; font-family: var(--f-mono); font-size: 11px; color: var(--mute); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { --c: var(--accent); display: inline-flex; align-items: center; gap: 8px; text-align: left; border: 1px solid color-mix(in srgb, var(--c) 50%, var(--line)); background: color-mix(in srgb, var(--c) 8%, transparent); border-radius: 6px; padding: 4px 10px; font-size: 13px; line-height: 1.2; transition: background 0.2s, color 0.2s; }
.chip:hover { background: color-mix(in srgb, var(--c) 20%, transparent); }
.chip .lbl { display: grid; min-width: 0; }
.chip .lbl small { font-size: 10.5px; color: var(--mute); }
.chip .n { font-family: var(--f-mono); font-size: 11px; color: var(--mute); font-variant-numeric: tabular-nums; }
.chip .pips { color: var(--c); }
.chip[aria-pressed="true"] { background: var(--c); color: var(--on-c); border-color: var(--c); }
.chip[aria-pressed="true"] .n, .chip[aria-pressed="true"] .lbl small { color: var(--on-c); opacity: 0.85; }
.chip[aria-pressed="true"] .pips { color: var(--on-c); }

.numb { display: inline-grid; place-items: center; flex: none; width: 19px; height: 19px; border-radius: 50%; background: var(--c); color: var(--on-c); font-family: var(--f-mono); font-weight: 500; font-size: 11px; line-height: 1; }
.chip[aria-pressed="true"] .numb { background: var(--on-c); color: var(--c); }
.pill .numb { background: var(--on-c); color: var(--c); width: 16px; height: 16px; font-size: 10px; }
.pips { display: inline-grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 16px; height: 16px; gap: 1px; padding: 1px; flex: none; }
.pips i { border-radius: 50%; background: transparent; }
.pips i.on { background: currentColor; }
.diechips .chip .pips { width: 20px; height: 20px; }

.scene { width: 380px; height: 380px; max-width: 100%; perspective: 1300px; flex: none; cursor: pointer; position: relative; }
.cube { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
.face { position: absolute; backface-visibility: hidden; background-image: linear-gradient(150deg, rgba(255,255,255,0.34), rgba(0,0,0,0.22)); }
.face b { position: absolute; font-family: var(--f-disp); font-weight: 600; font-size: 36px; line-height: 1; color: var(--on-c); transform: translate(-50%, -50%); text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
.dshadow { width: 90px; height: 14px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,0.35), transparent); margin-top: -8px; }
.rollbtn { margin: 0; border: 0; background: var(--c); color: var(--on-c); border-radius: 8px; padding: 10px 26px; font-weight: 600; font-size: 15px; transition: background 0.3s; }
.rollbtn:hover { filter: brightness(1.1); }
.dielab { margin: 0; text-align: left; }
.pfoot { min-height: 86px; width: 100%; display: grid; align-content: center; justify-items: center; }
.dierow { display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; }
.hint span { display: block; }
.filters { margin-top: 16px; display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.frow { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.flab { flex: 0 0 110px; padding-top: 6px; font-family: var(--f-disp); font-weight: 600; font-size: 17px; line-height: 1.2; }
.flab small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--mute); }
.frow .chips { flex: 1 1 0; min-width: 240px; }
.dielab b { display: block; color: var(--c); font-family: var(--f-disp); font-size: 21px; font-weight: 600; line-height: 1.2; }
.dielab small { color: var(--mute); font-size: 13px; }

.main { min-width: 0; padding-top: 28px; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-bottom: 16px; font-size: 13px; color: var(--mute); }
.status b { color: var(--ink); font-variant-numeric: tabular-nums; }
.resetbtn { margin-left: 0; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--green); background: transparent; color: var(--green); border-radius: 999px; padding: 8px 21px; font-size: 18.75px; font-weight: 600; }
.resetbtn:hover { background: var(--green); color: var(--on-green); }
.tfs { display: inline-flex; align-items: center; gap: 6px; }
.tfb { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--green); background: transparent; color: var(--green); border-radius: 999px; padding: 6px 13px; font-family: var(--f-mono); font-size: 14px; font-weight: 600; line-height: 1.2; }
.tfb:hover { background: color-mix(in srgb, var(--green) 14%, transparent); }
.tfb[aria-pressed="true"] { background: var(--green); color: var(--on-green); }
.tfb small { font-size: 11px; font-weight: 500; opacity: 0.8; }
.card.read { opacity: 0.5; }
.card.read:hover { opacity: 1; }
.vbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-bottom: 12px; }
.toolrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding-bottom: 12px; }
.toolrow .listenbar, .toolrow .vbar { padding-bottom: 0; gap: 5px; }
.toolrow .sep { align-self: stretch; width: 1px; min-height: 22px; background: var(--line); }
.toolrow .vb { padding: 3px 10px; font-size: 12px; }
.toolrow .vb.bkb { border-style: dashed; }
.bk > summary { display: none; }
.vb { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 13px; font-size: 13px; font-weight: 600; line-height: 1.3; }
.vb:hover { border-color: var(--green); }
.vb[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-green); }
.vb small { font-weight: 500; opacity: 0.8; margin-left: 4px; }
.tagrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tgc { border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--line)); background: transparent; color: var(--ink); border-radius: 6px; padding: 2px 9px; font-size: 12px; }
.tgc[aria-pressed="true"] { background: var(--accent); color: var(--on-c); border-color: var(--accent); }
.star, .rd { flex: none; border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line)); background: transparent; color: var(--c); border-radius: 999px; width: 30px; height: 28px; font-size: 15px; line-height: 1; padding: 0; }
.star[aria-pressed="true"] { background: var(--c); color: var(--on-c); }
.rd[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 25%, transparent); }
.ctags { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding-bottom: 10px; }
.ctg { display: inline-flex; align-items: center; gap: 4px; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--ink); border: 0; border-radius: 4px; padding: 1px 7px; font-size: 12px; }
.ctg span { opacity: 0.7; }
.ctin { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 2px 8px; font: inherit; font-size: 12px; width: 120px; }
.bk { margin: 0 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; }
.bk > summary { cursor: pointer; padding: 10px 0; font-weight: 600; font-size: 13px; }
.bk textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font-family: var(--f-mono); font-size: 11px; padding: 6px; }
.bk .vb { margin: 6px 6px 12px 0; }
.bk p { margin: 0 0 8px; color: var(--mute); font-size: 12.5px; }
.tag { --c: var(--accent); display: inline-flex; align-items: center; gap: 6px; background: var(--c); color: var(--on-c); border: 0; border-radius: 999px; padding: 3px 8px 3px 12px; font-size: 12px; font-weight: 500; }
.tag span { font-size: 15px; line-height: 1; opacity: 0.8; }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.card { --c: var(--accent); background: color-mix(in srgb, var(--c) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 28%, var(--line)); border-radius: 8px; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: border-color 0.2s, transform 0.2s; }
.card:hover { border-color: var(--c); transform: translateY(-2px); }
.head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ico { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: var(--c); }
.ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; flex: 1; min-width: 0; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--mute); }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--c); color: var(--on-c); border-radius: 999px; padding: 2px 10px 2px 6px; font-weight: 500; text-transform: none; letter-spacing: 0; font-family: var(--f-body); }
.pill .pips { width: 14px; height: 14px; padding: 0; }
.reg { display: inline-flex; align-items: center; gap: 5px; }
.reg::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rc); }
.meta .dt { margin-left: auto; font-variant-numeric: tabular-nums; }
.tx { display: grid; gap: 3px; }
.tx + .tx { border-top: 1px dashed color-mix(in srgb, var(--c) 30%, var(--line)); padding-top: 9px; }
.tx h3 { margin: 0; font-family: var(--f-disp); font-weight: 600; font-size: 15.5px; line-height: 1.3; text-wrap: balance; }
.tx:first-of-type h3 { font-size: 18.5px; }
:lang(zh).tx h3 { font-family: "Noto Serif SC", var(--f-disp); }
.tx h3::before { content: attr(data-l); display: inline-block; vertical-align: 2px; margin-right: 7px; padding: 0 5px; border-radius: 3px; background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--c); font-family: var(--f-mono); font-weight: 500; font-size: 10px; line-height: 16px; letter-spacing: 0.04em; }
.tx p { margin: 0; color: var(--mute); font-size: 13px; line-height: 1.5; }
.qbox { width: min(100%, 300px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 16px; font: inherit; font-size: 13.5px; }
.qbox:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.sigs { margin: 0 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; }
.sigs > summary { cursor: pointer; padding: 12px 0; font-weight: 600; font-size: 14px; list-style: none; display: flex; align-items: center; gap: 10px; }
.sigs > summary::-webkit-details-marker { display: none; }
.sigs > summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--mute); border-bottom: 2px solid var(--mute); transform: rotate(-45deg); transition: transform 0.2s; }
.sigs[open] > summary::before { transform: rotate(45deg); }
.sigs summary small { font-weight: 400; color: var(--mute); font-size: 12px; }
.sigwarn { margin: 0 0 12px; color: var(--mute); font-size: 12.5px; }
.siggrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; padding-bottom: 14px; }
.sig { border: 1px solid var(--line); border-left: 4px solid var(--c, var(--accent)); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; align-content: start; }
.sig h4 { margin: 0; font-family: var(--f-disp); font-size: 16px; line-height: 1.25; }
.sig h4 small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 12.5px; color: var(--mute); }
.sig ul { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--mute); display: grid; gap: 3px; }
.sig p { margin: 0; font-size: 13px; line-height: 1.45; }
.sig p b { font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.05em; color: var(--c, var(--accent)); margin-right: 6px; }
.sig p small { display: block; color: var(--mute); font-size: 12px; }
.tts, .listenbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tts { margin-top: auto; }
.listenbar { padding-bottom: 12px; font-size: 13px; color: var(--mute); }
.listenbar > span { margin-right: 4px; }
.ttsb { border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); background: transparent; color: var(--ink); border-radius: 999px; padding: 3px 11px; font-size: 12px; font-weight: 600; line-height: 1.4; }
.ttsb:hover { background: color-mix(in srgb, var(--c) 16%, transparent); }
.ttsb.on { background: var(--c); border-color: var(--c); color: var(--on-c); }
.listenbar .ttsb { --c: var(--accent); padding: 3px 10px; font-size: 12px; }
.toolrow .listenbar { font-size: 12px; }
.card.speaking { outline: 2px solid var(--c); outline-offset: 2px; }
.tts + .foot { margin-top: 0; }
.foot { display: flex; align-items: center; gap: 10px; margin-top: auto; padding: 12px 0 14px; border-top: 1px solid color-mix(in srgb, var(--c) 22%, var(--line)); min-width: 0; }
.code { flex: none; font-family: var(--f-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.06em; background: var(--ink); color: var(--bg); border-radius: 3px; padding: 3px 6px; }
.sn { min-width: 0; font-size: 12px; line-height: 1.3; }
.sn small { display: block; color: var(--mute); font-size: 10.5px; }
.go { margin-left: auto; flex: none; font-size: 12px; font-weight: 600; color: var(--c); text-decoration: none; text-align: right; line-height: 1.3; }
.go:hover { text-decoration: underline; }
.empty { grid-column: 1 / -1; padding: 40px 16px; text-align: center; color: var(--mute); border: 1px dashed var(--line); border-radius: 6px; display: grid; gap: 2px; }

.srcs { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 4px; }
.srcs summary { display: flex; align-items: center; gap: 10px; padding: 14px 0; cursor: pointer; list-style: none; font-family: var(--f-disp); font-weight: 600; font-size: 20px; }
.srcs summary::-webkit-details-marker { display: none; }

    ["TBN","2026-10-25","JOB","ASIA","https://www.thailand-business-news.com/crime/336414-rule-of-law-slump-threatens-thailands-fdi-and-oecd-ambitions",["Thailand slips three places to 80th of 143 in the Rule of Law Index","The World Justice Project index (24 Oct) gives Thailand 0.50 out of 1.00. Thailand Business News argues the slide could weaken foreign investment and its goal of joining the OECD by 2028; corruption and regulatory-enforcement scores both fell to 0.44."],["Thailand rutscht im Rechtsstaatsindex um drei Plätze auf Rang 80 von 143","Der Index des World Justice Project (24. Okt.) gibt Thailand 0,50 von 1,00 Punkten. Thailand Business News meint, der Abstieg könne ausländische Investitionen und das Ziel eines OECD-Beitritts bis 2028 belasten; Korruptionsfreiheit und Regeldurchsetzung fielen beide auf 0,44."],["泰国在法治指数中下滑三位，列143国第80","世界正义工程指数（10月24日）给泰国打0.50分（满分1.00）。泰国商业新闻认为，下滑可能削弱外资吸引力及2028年加入经合组织的目标；廉洁度与监管执行两项得分均降至0.44。"]],
    ["NAT","2026-10-25","JOB","ASIA","https://www.nationthailand.com/news/policy/40072725",["Thailand drafts a licence requirement for all parcel-delivery operators","On 25 Oct, Deputy Digital Minister Boonthida Somchai said the draft postal law would cover existing firms too, responding to worries that e-commerce platforms and aggressive pricing squeeze small Thai couriers. A 51% Thai-ownership rule is under consideration but not decided, and the bill still needs legal clearance and consultation."],["Thailand plant Lizenzpflicht für alle Paketdienste","Am 25. Okt. sagte Digitalvizeministerin Boonthida Somchai, der Entwurf des Postgesetzes gelte auch für bestehende Firmen; Anlass sind Sorgen, dass E-Commerce-Plattformen und Kampfpreise kleine thailändische Zusteller verdrängen. Eine 51-%-Beteiligung thailändischer Eigner wird erwogen, ist aber nicht beschlossen; der Entwurf braucht noch rechtliche Prüfung und Anhörung."],["泰国拟对所有包裹快递企业实行许可制","10月25日，数字经济与社会部副部长Boonthida Somchai表示，邮政法草案将涵盖现有企业，起因是电商平台和低价竞争挤压泰国本土小型快递商。当局正考虑泰方持股51%的要求，但尚未定案，草案还需法律审查和各方磋商。"]],
    ["NAT","2026-10-25","JOB","ASIA","https://www.nationthailand.com/news/general/40072726",["Met Department warns of heavy rain in the South as a Bay of Bengal storm forms","On 25 Oct the TMD warned of intense downpours for one to three days in the central South, with flash-flood and landslide risk from a monsoon trough and a low-pressure area. The Bay of Bengal storm is forecast to head toward India or Bangladesh rather than Thailand."],["Wetterdienst warnt vor Starkregen im Süden, während sich ein Sturm im Golf von Bengalen bildet","Am 25. Okt. warnte der TMD vor ein bis drei Tagen intensiven Regens im zentralen Süden mit Sturzflut- und Erdrutschgefahr durch Monsuntrog und Tiefdruckgebiet. Der Sturm im Golf von Bengalen soll Richtung Indien oder Bangladesch ziehen, nicht nach Thailand."],["气象厅警告南部将有强降雨，孟加拉湾风暴正在形成","10月25日，泰国气象厅警告中南部未来1至3天将有强降雨，季风槽和低压区带来山洪与山体滑坡风险。孟加拉湾风暴预计移向印度或孟加拉国，而非泰国。"]],
    ["NAT","2026-10-25","JOB","ASIA","https://www.nationthailand.com/news/general/40072708",["Transport Ministry to propose extending the flat-rate rail day pass to end-2027","Deputy spokesperson Ploythalay Laksameesaengjan said on 25 Oct the pass for the SRT Red Line and MRTA Purple Line, due to end 30 Nov, would be extended to 31 Dec 2027. Data to August show daily trips up 89.01% on the Red Line and 135.41% on the Purple Line."],["Verkehrsministerium will den Pauschal-Tagespass für die Bahn bis Ende 2027 verlängern","Vize-Regierungssprecherin Ploythalay Laksameesaengjan sagte am 25. Okt., der Pass für SRT-Rote Linie und MRTA-Lila Linie, der am 30. Nov. endet, solle bis 31. Dez. 2027 laufen. Bis August stiegen die Tagesfahrten auf der Roten Linie um 89,01 %, auf der Lila Linie um 135,41 %."],["交通部拟将轻轨日票优惠延长至2027年底","政府副发言人Ploythalay Laksameesaengjan 10月25日表示，国铁红线与捷运紫线的统一日票原定11月30日结束，将提议延至2027年12月31日。截至8月的数据显示，红线日客流增89.01%，紫线增135.41%。"]],
