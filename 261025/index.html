<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Truth Global</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@600&family=Source+Serif+4:wght@500;600&display=swap">
<style>
/* Layout (time filters added 24 Oct 2026 evening, Bangkok; data refreshed 25 Oct): header, then globe and 3D die side by side as one instrument deck, then reading cards that carry English, German and Chinese together with a small topic icon, then a folded source row. Six topic hues and four region hues carry the colour; neutrals stay cool slate. */
:root {
  --bg: #E6EBEF;
  --surface: #F6F8FA;
  --ink: #1B2833;
  --mute: #566673;
  --line: #C9D3DB;
  --chip: #D8E0E6;
  --accent: #2C5C61;
  --blue: #1D4F91;
  --green: #2E6B47;
  --on-green: #FFFFFF;
  --on-c: #FFFFFF;
  --ocean: #D3E3EE;
  --c-US: #3A5FA8;
  --c-GP: #7A4FA3;
  --c-FIN: #2E8050;
  --c-TEC: #B26A00;
  --c-CN: #C23A33;
  --c-ME: #1E8189;
  --c-JOB: #6E7B1F;
  --c-GER: #3F4650;
  --c-EU: #0F73B5;
  --c-KEYS: #A67C00;
  --c-FAITH: #B03A7A;
  --c-NATURE: #8A5A3B;
  --r-AME: #D9603B;
  --r-EUR: #4A5BCF;
  --r-MEA: #C99A1B;
  --r-ASIA: #1F9A73;
  --f-disp: "Source Serif 4", "Noto Serif SC", Georgia, serif;
  --f-body: "IBM Plex Sans", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11181D; --surface: #1A2329; --ink: #E5EAEE; --mute: #94A1AB; --line: #2B363D; --chip: #232F36; --accent: #86BAB7; --blue: #7FB0EA; --green: #6DBA89; --on-green: #0F1A14; --on-c: #11181D; --ocean: #172530;
    --c-US: #86A9EE; --c-GP: #BE9CE8; --c-FIN: #78CB98; --c-TEC: #F2B55C; --c-CN: #F28C82; --c-ME: #6FD0D8; --c-FAITH: #E88FBF; --c-NATURE: #D1A07C; --c-JOB: #C9D45A; --c-GER: #B7BEC8; --c-EU: #6FB8E8; --c-KEYS: #E3C45A;
    --r-AME: #F08B68; --r-EUR: #8D9AF2; --r-MEA: #E6BD4F; --r-ASIA: #5AD1A8;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11181D; --surface: #1A2329; --ink: #E5EAEE; --mute: #94A1AB; --line: #2B363D; --chip: #232F36; --accent: #86BAB7; --blue: #7FB0EA; --green: #6DBA89; --on-green: #0F1A14; --on-c: #11181D; --ocean: #172530;
  --c-US: #86A9EE; --c-GP: #BE9CE8; --c-FIN: #78CB98; --c-TEC: #F2B55C; --c-CN: #F28C82; --c-ME: #6FD0D8; --c-FAITH: #E88FBF; --c-NATURE: #D1A07C; --c-JOB: #C9D45A; --c-GER: #B7BEC8; --c-EU: #6FB8E8; --c-KEYS: #E3C45A;
  --r-AME: #F08B68; --r-EUR: #8D9AF2; --r-MEA: #E6BD4F; --r-ASIA: #5AD1A8;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 15px; line-height: 1.55; }
a { color: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
:lang(zh) { font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", var(--f-body); }
.wrap { max-width: 1280px; margin: 0 auto; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px 32px; }
.brand { min-width: 0; flex: 1 1 380px; }
.brand h1 { margin: 0; color: var(--blue); font-family: var(--f-disp); font-weight: 600; font-size: clamp(34px, 5.5vw, 54px); line-height: 1.05; letter-spacing: -0.01em; text-wrap: balance; }
.brand p { margin: 10px 0 0; max-width: 40em; color: var(--mute); font-size: 14px; display: grid; gap: 1px; }
.tools { display: flex; flex-wrap: wrap; justify-content: flex-end; align-items: center; gap: 8px; flex: 0 1 490px; margin-left: auto; }
.tools .ed { flex: 0 0 100%; }
.qbox { width: 200px !important; }
.seg { display: inline-flex; background: var(--chip); border-radius: 999px; padding: 3px; }
.seg button { border: 0; background: transparent; border-radius: 999px; padding: 6px 14px; font-size: 13px; font-weight: 500; color: var(--mute); }
.seg button[aria-pressed="true"] { background: var(--green); color: var(--on-green); }
.ed { font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.06em; color: var(--mute); text-align: right; display: grid; gap: 1px; }
.strip { height: 5px; border-radius: 3px; margin-top: 20px; background: linear-gradient(90deg, var(--c-US) 0.000% 8.333%, var(--c-GP) 8.333% 16.667%, var(--c-FIN) 16.667% 25.000%, var(--c-TEC) 25.000% 33.333%, var(--c-CN) 33.333% 41.667%, var(--c-ME) 41.667% 50.000%, var(--c-FAITH) 50.000% 58.333%, var(--c-NATURE) 58.333% 66.667%, var(--c-JOB) 66.667% 75.000%, var(--c-GER) 75.000% 83.333%, var(--c-EU) 83.333% 91.667%, var(--c-KEYS) 91.667% 100.000%); }

.deck { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; padding-top: 22px; }
.panel { --c: var(--accent); display: flex; flex-direction: column; align-items: center; gap: 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 18px; min-width: 0; text-align: center; }
.pvis { margin: 0 auto; flex: 0 1 auto; max-width: 100%; display: grid; justify-items: center; gap: 14px; }
.pctl { width: 100%; min-width: 0; display: grid; gap: 6px; justify-items: center; }
.ph { margin-bottom: 8px; }
.ph h2 { margin: 0; font-family: var(--f-disp); font-weight: 600; font-size: 24px; line-height: 1.15; }
.ph h2 small { font-family: var(--f-body); font-weight: 500; font-size: 15px; color: var(--mute); margin-left: 6px; }
.ph p { margin: 2px 0 0; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.04em; color: var(--mute); }
.globe { display: block; width: min(100%, 380px); height: auto; aspect-ratio: 1; cursor: grab; touch-action: pan-y; }
.globe:active { cursor: grabbing; }
.hint { margin: 0; font-family: var(--f-mono); font-size: 11px; color: var(--mute); }

.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { --c: var(--accent); display: inline-flex; align-items: center; gap: 8px; text-align: left; border: 1px solid color-mix(in srgb, var(--c) 50%, var(--line)); background: color-mix(in srgb, var(--c) 8%, transparent); border-radius: 6px; padding: 4px 10px; font-size: 13px; line-height: 1.2; transition: background 0.2s, color 0.2s; }
.chip:hover { background: color-mix(in srgb, var(--c) 20%, transparent); }
.chip .lbl { display: grid; min-width: 0; }
.chip .lbl small { font-size: 10.5px; color: var(--mute); }
.chip .n { font-family: var(--f-mono); font-size: 11px; color: var(--mute); font-variant-numeric: tabular-nums; }
.chip .pips { color: var(--c); }
.chip[aria-pressed="true"] { background: var(--c); color: var(--on-c); border-color: var(--c); }
.chip[aria-pressed="true"] .n, .chip[aria-pressed="true"] .lbl small { color: var(--on-c); opacity: 0.85; }
.chip[aria-pressed="true"] .pips { color: var(--on-c); }

.numb { display: inline-grid; place-items: center; flex: none; width: 19px; height: 19px; border-radius: 50%; background: var(--c); color: var(--on-c); font-family: var(--f-mono); font-weight: 500; font-size: 11px; line-height: 1; }
.chip[aria-pressed="true"] .numb { background: var(--on-c); color: var(--c); }
.pill .numb { background: var(--on-c); color: var(--c); width: 16px; height: 16px; font-size: 10px; }
.pips { display: inline-grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); width: 16px; height: 16px; gap: 1px; padding: 1px; flex: none; }
.pips i { border-radius: 50%; background: transparent; }
.pips i.on { background: currentColor; }
.diechips .chip .pips { width: 20px; height: 20px; }

.scene { width: 380px; height: 380px; max-width: 100%; perspective: 1300px; flex: none; cursor: pointer; position: relative; }
.cube { position: absolute; left: 50%; top: 50%; width: 0; height: 0; transform-style: preserve-3d; }
.face { position: absolute; backface-visibility: hidden; background-image: linear-gradient(150deg, rgba(255,255,255,0.34), rgba(0,0,0,0.22)); }
.face b { position: absolute; font-family: var(--f-disp); font-weight: 600; font-size: 36px; line-height: 1; color: var(--on-c); transform: translate(-50%, -50%); text-shadow: 0 1px 2px rgba(0,0,0,0.3); }
.dshadow { width: 90px; height: 14px; border-radius: 50%; background: radial-gradient(closest-side, rgba(0,0,0,0.35), transparent); margin-top: -8px; }
.rollbtn { margin: 0; border: 0; background: var(--c); color: var(--on-c); border-radius: 8px; padding: 10px 26px; font-weight: 600; font-size: 15px; transition: background 0.3s; }
.rollbtn:hover { filter: brightness(1.1); }
.dielab { margin: 0; text-align: left; }
.pfoot { min-height: 86px; width: 100%; display: grid; align-content: center; justify-items: center; }
.dierow { display: flex; align-items: center; justify-content: center; gap: 22px; flex-wrap: wrap; }
.hint span { display: block; }
.filters { margin-top: 16px; display: grid; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; }
.frow { display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.flab { flex: 0 0 110px; padding-top: 6px; font-family: var(--f-disp); font-weight: 600; font-size: 17px; line-height: 1.2; }
.flab small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 12px; color: var(--mute); }
.frow .chips { flex: 1 1 0; min-width: 240px; }
.dielab b { display: block; color: var(--c); font-family: var(--f-disp); font-size: 21px; font-weight: 600; line-height: 1.2; }
.dielab small { color: var(--mute); font-size: 13px; }

.main { min-width: 0; padding-top: 28px; }
.status { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-bottom: 16px; font-size: 13px; color: var(--mute); }
.status b { color: var(--ink); font-variant-numeric: tabular-nums; }
.resetbtn { margin-left: 0; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--green); background: transparent; color: var(--green); border-radius: 999px; padding: 8px 21px; font-size: 18.75px; font-weight: 600; }
.resetbtn:hover { background: var(--green); color: var(--on-green); }
.tfs { display: inline-flex; align-items: center; gap: 6px; }
.tfb { display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid var(--green); background: transparent; color: var(--green); border-radius: 999px; padding: 6px 13px; font-family: var(--f-mono); font-size: 14px; font-weight: 600; line-height: 1.2; }
.tfb:hover { background: color-mix(in srgb, var(--green) 14%, transparent); }
.tfb[aria-pressed="true"] { background: var(--green); color: var(--on-green); }
.tfb small { font-size: 11px; font-weight: 500; opacity: 0.8; }
.card.read { opacity: 0.5; }
.card.read:hover { opacity: 1; }
.vbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; padding-bottom: 12px; }
.toolrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; padding-bottom: 12px; }
.toolrow .listenbar, .toolrow .vbar { padding-bottom: 0; gap: 5px; }
.toolrow .sep { align-self: stretch; width: 1px; min-height: 22px; background: var(--line); }
.toolrow .vb { padding: 3px 10px; font-size: 12px; }
.toolrow .vb.bkb { border-style: dashed; }
.bk > summary { display: none; }
.vb { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 5px 13px; font-size: 13px; font-weight: 600; line-height: 1.3; }
.vb:hover { border-color: var(--green); }
.vb[aria-pressed="true"] { background: var(--green); border-color: var(--green); color: var(--on-green); }
.vb small { font-weight: 500; opacity: 0.8; margin-left: 4px; }
.tagrow { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tgc { border: 1px solid color-mix(in srgb, var(--accent) 50%, var(--line)); background: transparent; color: var(--ink); border-radius: 6px; padding: 2px 9px; font-size: 12px; }
.tgc[aria-pressed="true"] { background: var(--accent); color: var(--on-c); border-color: var(--accent); }
.star, .rd { flex: none; border: 1px solid color-mix(in srgb, var(--c) 40%, var(--line)); background: transparent; color: var(--c); border-radius: 999px; width: 30px; height: 28px; font-size: 15px; line-height: 1; padding: 0; }
.star[aria-pressed="true"] { background: var(--c); color: var(--on-c); }
.rd[aria-pressed="true"] { background: color-mix(in srgb, var(--c) 25%, transparent); }
.ctags { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding-bottom: 10px; }
.ctg { display: inline-flex; align-items: center; gap: 4px; background: color-mix(in srgb, var(--c) 16%, transparent); color: var(--ink); border: 0; border-radius: 4px; padding: 1px 7px; font-size: 12px; }
.ctg span { opacity: 0.7; }
.ctin { border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 6px; padding: 2px 8px; font: inherit; font-size: 12px; width: 120px; }
.bk { margin: 0 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; }
.bk > summary { cursor: pointer; padding: 10px 0; font-weight: 600; font-size: 13px; }
.bk textarea { width: 100%; min-height: 70px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg); color: var(--ink); font-family: var(--f-mono); font-size: 11px; padding: 6px; }
.bk .vb { margin: 6px 6px 12px 0; }
.bk p { margin: 0 0 8px; color: var(--mute); font-size: 12.5px; }
.tag { --c: var(--accent); display: inline-flex; align-items: center; gap: 6px; background: var(--c); color: var(--on-c); border: 0; border-radius: 999px; padding: 3px 8px 3px 12px; font-size: 12px; font-weight: 500; }
.tag span { font-size: 15px; line-height: 1; opacity: 0.8; }
.list { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 14px; }
.card { --c: var(--accent); background: color-mix(in srgb, var(--c) 8%, var(--surface)); border: 1px solid color-mix(in srgb, var(--c) 28%, var(--line)); border-radius: 8px; padding: 14px 16px 0; display: flex; flex-direction: column; gap: 10px; min-width: 0; transition: border-color 0.2s, transform 0.2s; }
.card:hover { border-color: var(--c); transform: translateY(-2px); }
.head { display: flex; align-items: center; gap: 10px; min-width: 0; }
.ico { flex: none; width: 34px; height: 34px; border-radius: 9px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, var(--surface)); color: var(--c); }
.ico svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; flex: 1; min-width: 0; font-family: var(--f-mono); font-size: 11px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--mute); }
.pill { display: inline-flex; align-items: center; gap: 6px; background: var(--c); color: var(--on-c); border-radius: 999px; padding: 2px 10px 2px 6px; font-weight: 500; text-transform: none; letter-spacing: 0; font-family: var(--f-body); }
.pill .pips { width: 14px; height: 14px; padding: 0; }
.reg { display: inline-flex; align-items: center; gap: 5px; }
.reg::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rc); }
.meta .dt { margin-left: auto; font-variant-numeric: tabular-nums; }
.tx { display: grid; gap: 3px; }
.tx + .tx { border-top: 1px dashed color-mix(in srgb, var(--c) 30%, var(--line)); padding-top: 9px; }
.tx h3 { margin: 0; font-family: var(--f-disp); font-weight: 600; font-size: 15.5px; line-height: 1.3; text-wrap: balance; }
.tx:first-of-type h3 { font-size: 18.5px; }
:lang(zh).tx h3 { font-family: "Noto Serif SC", var(--f-disp); }
.tx h3::before { content: attr(data-l); display: inline-block; vertical-align: 2px; margin-right: 7px; padding: 0 5px; border-radius: 3px; background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--c); font-family: var(--f-mono); font-weight: 500; font-size: 10px; line-height: 16px; letter-spacing: 0.04em; }
.tx p { margin: 0; color: var(--mute); font-size: 13px; line-height: 1.5; }
.qbox { width: min(100%, 300px); border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 999px; padding: 7px 16px; font: inherit; font-size: 13.5px; }
.qbox:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
.sigs { margin: 0 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 0 16px; }
.sigs > summary { cursor: pointer; padding: 12px 0; font-weight: 600; font-size: 14px; list-style: none; display: flex; align-items: center; gap: 10px; }
.sigs > summary::-webkit-details-marker { display: none; }
.sigs > summary::before { content: ""; width: 8px; height: 8px; border-right: 2px solid var(--mute); border-bottom: 2px solid var(--mute); transform: rotate(-45deg); transition: transform 0.2s; }
.sigs[open] > summary::before { transform: rotate(45deg); }
.sigs summary small { font-weight: 400; color: var(--mute); font-size: 12px; }
.sigwarn { margin: 0 0 12px; color: var(--mute); font-size: 12.5px; }
.siggrid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; padding-bottom: 14px; }
.sig { border: 1px solid var(--line); border-left: 4px solid var(--c, var(--accent)); border-radius: 8px; padding: 12px 14px; display: grid; gap: 8px; align-content: start; }
.sig h4 { margin: 0; font-family: var(--f-disp); font-size: 16px; line-height: 1.25; }
.sig h4 small { display: block; font-family: var(--f-body); font-weight: 400; font-size: 12.5px; color: var(--mute); }
.sig ul { margin: 0; padding-left: 18px; font-size: 12.5px; color: var(--mute); display: grid; gap: 3px; }
.sig p { margin: 0; font-size: 13px; line-height: 1.45; }
.sig p b { font-family: var(--f-mono); font-size: 10.5px; font-weight: 500; letter-spacing: 0.05em; color: var(--c, var(--accent)); margin-right: 6px; }
.sig p small { display: block; color: var(--mute); font-size: 12px; }
.tts, .listenbar { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.tts { margin-top: auto; }
.listenbar { padding-bottom: 12px; font-size: 13px; color: var(--mute); }
.listenbar > span { margin-right: 4px; }
.ttsb { border: 1px solid color-mix(in srgb, var(--c) 45%, var(--line)); background: transparent; color: var(--ink); border-radius: 999px; padding: 3px 11px; font-size: 12px; font-weight: 600; line-height: 1.4; }
.ttsb:hover { background: color-mix(in srgb, var(--c) 16%, transparent); }
.ttsb.on { background: var(--c); border-color: var(--c); color: var(--on-c); }
.listenbar .ttsb { --c: var(--accent); padding: 3px 10px; font-size: 12px; }
.toolrow .listenbar { font-size: 12px; }
.card.speaking { outline: 2px solid var(--c); outline-offset: 2px; }
.tts + .foot { margin-top: 0; }
.foot { display: flex; align-items: center; gap: 10px; margin-top: auto; padding: 12px 0 14px; border-top: 1px solid color-mix(in srgb, var(--c) 22%, var(--line)); min-width: 0; }
.code { flex: none; font-family: var(--f-mono); font-size: 10px; font-weight: 500; letter-spacing: 0.06em; background: var(--ink); color: var(--bg); border-radius: 3px; padding: 3px 6px; }
.sn { min-width: 0; font-size: 12px; line-height: 1.3; }
.sn small { display: block; color: var(--mute); font-size: 10.5px; }
.go { margin-left: auto; flex: none; font-size: 12px; font-weight: 600; color: var(--c); text-decoration: none; text-align: right; line-height: 1.3; }
.go:hover { text-decoration: underline; }
.empty { grid-column: 1 / -1; padding: 40px 16px; text-align: center; color: var(--mute); border: 1px dashed var(--line); border-radius: 6px; display: grid; gap: 2px; }

.srcs { margin-top: 40px; border-top: 1px solid var(--line); padding-top: 4px; }
.srcs summary { display: flex; align-items: center; gap: 10px; padding: 14px 0; cursor: pointer; list-style: none; font-family: var(--f-disp); font-weight: 600; font-size: 20px; }
.srcs summary::-webkit-details-marker { display: none; }

.srcs summary .cnt { font-family: var(--f-mono); font-size: 12px; font-weight: 400; color: var(--mute); }

    ["IMP","2026-11","JOB","ASIA","https://www.impact.co.th/en/visitors/event-calendar/exhibition-trade/digitech-asean-thailand-ai-connect-2026",["Ahead: DigiTech ASEAN Thailand & AI Connect 2026 at IMPACT, 25–27 Nov (organiser listing)","IMPACT's event calendar lists the free-entry show. It may suit staff and students following AI and digital skills, though the listing gives no job-fair programme."],["Vorschau: DigiTech ASEAN Thailand & AI Connect 2026 im IMPACT, 25.–27. Nov. (Veranstalterliste)","Der Veranstaltungskalender von IMPACT führt die Messe mit freiem Eintritt auf. Sie kann für KI- und Digitalkompetenzen von Interesse sein; ein Jobmessen-Programm nennt der Eintrag nicht."],["预告：DigiTech ASEAN泰国暨AI Connect 2026在IMPACT举行，11月25至27日（主办方列表）","IMPACT的活动日历列出了这场免费入场的展会。它对关注AI与数字技能的员工和学生可能有参考价值，但列表中没有招聘会安排。"]],
    ["NAT","2026-10-26","JOB","ASIA","https://www.nationthailand.com/business/economy/40072763",["EEC office warns the three-airport high-speed rail may collapse before a November board review","The Eastern Economic Corridor office says the Don Mueang–Suvarnabhumi–U-Tapao rail link is at risk because the CP Group-linked concessionaire has sought to end the contract and lenders have declined to fund it. PM Anutin chairs the policy committee that takes it up in November; options include cutting design speed from 250 to 160 km/h (The Nation, 26 Oct)."],["EEC-Büro warnt: Hochgeschwindigkeitsbahn zwischen drei Flughäfen könnte scheitern","Das EEC-Büro erklärt, die Strecke Don Mueang–Suvarnabhumi–U-Tapao sei gefährdet, weil der CP-nahe Konzessionär den Vertrag beenden will und Geldgeber die Finanzierung verweigern. Der unter Premier Anutin tagende Ausschuss berät im November; im Gespräch ist eine Senkung der Auslegungsgeschwindigkeit von 250 auf 160 km/h (The Nation, 26. Okt.)."],["东部经济走廊办公室警告：三机场高铁在11月董事会审议前或告吹","东部经济走廊（EEC）办公室称，连接廊曼、素万那普和乌塔堡三机场的高铁面临风险：与正大集团有关联的特许经营方已申请终止合同，贷款方也拒绝提供资金。由总理阿努廷主持的政策委员会将于11月审议，备选方案包括把设计时速从250公里降至160公里（泰国民族报，10月26日）。"]],
    ["NAT","2026-10-26","JOB","ASIA","https://www.nationthailand.com/news/world/40072764",["Thailand, Laos and Myanmar plan a shared haze-monitoring system under the CLEAR Sky Strategy","The three countries launched the CLEAR Sky Strategy (2024–2030), building on an April 2023 agreement. It foresees shared real-time PM2.5 monitoring, a common fire-risk map and a joint working group meeting at least yearly; no numerical targets were given (The Nation, 26 Oct)."],["Thailand, Laos und Myanmar planen gemeinsames Smog-Überwachungssystem (CLEAR-Sky-Strategie)","Die drei Länder starteten die CLEAR-Sky-Strategie (2024–2030) auf Grundlage eines Abkommens vom April 2023. Vorgesehen sind eine gemeinsame Echtzeit-Überwachung von PM2,5, eine gemeinsame Brandrisikokarte und eine Arbeitsgruppe, die mindestens einmal jährlich tagt; Zahlenziele nennt der Bericht nicht (The Nation, 26. Okt.)."],["泰国、老挝、缅甸拟建共享雾霾监测系统（CLEAR Sky战略）","三国启动2024–2030年“CLEAR Sky”战略，以2023年4月的协议为基础。计划包括共享PM2.5实时监测、统一的火险地图，以及至少每年开会一次的联合工作组；报道未给出具体数字目标（泰国民族报，10月26日）。"]],
    ["BRT","2026-10-25","ME","MEA","https://www.breitbart.com/politics/2026/10/25/trump-on-iran-do-i-make-a-deal-or-finish-them-off-military-readies-new-strike-options/",["Breitbart: Trump says it is ‘a deal or finish them off’ on Iran, with strike options reportedly ready","On Fox News, Trump said the only question is whether to make a deal or ‘finish them off’, adding there would be no strike that day. Breitbart cites The Hill (via a source) that CENTCOM has strike plans awaiting authorisation and the New York Times that energy infrastructure was considered; the outlet’s account of a naval blockade is Trump’s own claim."],["Breitbart: Trump sieht bei Iran nur ‚Deal oder erledigen‘; Angriffsoptionen angeblich bereit","Bei Fox News sagte Trump, die einzige Frage sei, ob man einen Deal mache oder sie ‚erledige‘; an dem Tag werde es keinen Angriff geben. Breitbart zitiert The Hill (anonyme Quelle), CENTCOM habe Angriffspläne zur Freigabe bereit, und die New York Times, auch Energieanlagen seien erwogen worden; die Darstellung der Seeblockade ist Trumps eigene Aussage."],["Breitbart：特朗普称对伊朗“要么达成协议，要么彻底解决”，打击方案据报已备好","特朗普在福克斯新闻上说，唯一的问题是与伊朗达成协议还是“彻底解决”，并称当天不会发动打击。Breitbart援引《国会山报》（匿名消息源）称中央司令部已备好待批的打击方案，并援引《纽约时报》称曾考虑打击能源设施；海军封锁的说法为特朗普本人的主张。"]],
    ["TOI","2026-10-26","ME","MEA","https://www.timesofisrael.com/netanyahus-crypto-bet-signals-a-dangerous-readiness-to-accept-economic-isolation/",["Analysis: Netanyahu’s idea of using crypto against sanctions could unsettle investors","Days before the 27 Oct election Netanyahu floated using crypto and blockchain to bypass possible sanctions, while the Bank of Israel said crypto cannot serve that purpose. The Times of Israel analyst argues this signals acceptance of isolation; tech is about 20% of GDP and 50% of exports, and about 80% of startup venture capital is foreign (analysis, 26 Oct)."],["Analyse: Netanjahus Krypto-Idee gegen Sanktionen könnte Investoren verunsichern","Wenige Tage vor der Wahl am 27. Okt. brachte Netanjahu Krypto und Blockchain zur Umgehung möglicher Sanktionen ins Spiel; die Bank von Israel erklärte, Krypto könne dafür nicht dienen. Die Autorin der Times of Israel sieht darin die Bereitschaft zur Isolation; Tech macht etwa 20 % des BIP und 50 % der Exporte aus, rund 80 % des Startup-Risikokapitals sind ausländisch (Analyse, 26. Okt.)."],["分析：内塔尼亚胡提出用加密货币规避制裁，或令投资者不安","在10月27日大选前几天，内塔尼亚胡提出用加密货币和区块链绕开可能的制裁，以色列央行则表示加密货币不能用于此目的。《以色列时报》的分析认为这意味着接受经济孤立；科技业约占GDP的20%、出口的50%，初创企业约80%的风险投资来自海外（分析文章，10月26日）。"]],
    ["BRT","2026-10-24","EU","EUR","https://www.breitbart.com/europe/2026/10/24/ukraines-starlink-access-fully-restored-says-kyiv/",["Breitbart: Kyiv says Ukraine’s Starlink access is fully restored after a week of disruption","Citing the AP, Breitbart reports Zelenskyy said Starlink and Starshield speeds are back to pre-restriction levels after front-line operations were hit for over a week. Who ordered the interruption remains unclear: Trump says he did not, while Rubio and Hegseth deny administration involvement (the outlet’s report)."],["Breitbart: Kiew meldet volle Wiederherstellung des Starlink-Zugangs nach einer Woche Störung","Unter Berufung auf AP berichtet Breitbart, Selenskyj habe erklärt, Starlink und Starshield liefen wieder mit den früheren Geschwindigkeiten, nachdem Frontoperationen über eine Woche gestört waren. Wer die Unterbrechung anordnete, bleibt offen: Trump sagt, nicht er; Rubio und Hegseth bestreiten eine Beteiligung der Regierung (Bericht des Mediums)."],["Breitbart：基辅称乌克兰星链服务在中断一周后已完全恢复","Breitbart援引美联社报道，泽连斯基表示星链和Starshield速度已恢复到限制前水平，此前前线行动受影响超过一周。谁下令中断仍不明朗：特朗普称不是自己，卢比奥和赫格塞思否认政府参与（该媒体的报道）。"]],
    ["CXG","2026-10-26","CN","ASIA","https://www.caixinglobal.com/2026-10-26/chinas-first-regional-power-market-begins-full-operation-102497300.html",["China’s first regional power market begins full operation across five southern regions","Caixin reports a new mechanism removes provincial barriers across five southern regions to create a common pricing hub. It is meant to allocate power better and absorb record renewable output (Caixin Global, 26 Oct)."],["Chinas erster regionaler Strommarkt nimmt in fünf südlichen Regionen den Vollbetrieb auf","Caixin berichtet, ein neuer Mechanismus beseitige Provinzgrenzen in fünf südlichen Regionen und schaffe einen gemeinsamen Preisknoten. Er soll Strom besser verteilen und Rekordmengen erneuerbarer Energie aufnehmen (Caixin Global, 26. Okt.)."],["中国首个区域电力市场在南方五地全面运行","财新报道，新机制打破南方五个区域的省间壁垒，形成统一的定价枢纽，旨在更好地配置电力并消纳创纪录的可再生能源发电量（财新全球，10月26日）。"]],
    ["NAT","2026-10-26","JOB","ASIA","https://www.nationthailand.com/business/banking-finance/40072752",["Bank of Thailand tightens checks on cash deals of THB5m or more from 1 Nov","The Nation reports that from 1 November banks must run enhanced customer checks on large cash transactions at branches. Electronic services are not affected, so the rule mainly touches cash-heavy business owners."],["Bank of Thailand verschärft Prüfungen bei Bargeschäften ab 5 Mio. Baht ab 1. Nov.","The Nation berichtet, dass Banken ab dem 1. November bei großen Bargeschäften in Filialen verstärkte Kundenprüfungen durchführen müssen. Elektronische Dienste bleiben unberührt; die Regel trifft vor allem bargeldlastige Unternehmer."],["泰国央行：11月1日起，500万泰铢及以上现金交易须加强客户核查","泰国民族报报道，自11月1日起，银行对柜台大额现金交易须进行强化客户核查，电子服务不受影响，因此规定主要影响以现金为主的经营者。"]],
    ["NAT","2026-10-26","JOB","ASIA","https://www.nationthailand.com/news/asean/40072753",["Border markers 52–59: Thai fence project becomes a political row in Cambodia","The Nation says a Thai border-fence project near markers 52–59 has become a flashpoint in Cambodia, where Hun Manet challenged a critic to back up land-loss claims. It is one more sign of how sensitive the border stays."],["Grenzmarkierungen 52–59: Thailands Zaunprojekt wird in Kambodscha zum Politikum","Laut The Nation ist ein thailändisches Grenzzaunprojekt nahe den Markierungen 52–59 in Kambodscha zum Streitpunkt geworden; Hun Manet forderte einen Kritiker auf, Behauptungen über Landverlust zu belegen. Die Grenze bleibt ein sensibles Thema."],["边界桩52至59号：泰方围栏项目在柬埔寨成为政治争议","泰国民族报称，泰国在52至59号界桩附近的边境围栏项目在柬埔寨成为焦点，洪玛奈要求一名批评者拿出土地流失的证据。这再次显示边界问题依然敏感。"]],
    ["NAT","2026-10-26","JOB","ASIA","https://www.nationthailand.com/news/general/40072729",["Meteorological Department warns six provinces of torrential rain on 26–27 Oct","The Nation carries the weather agency's warning of heavy rain in six provinces over two days. Travellers and commuters in affected areas should check local forecasts."],["Wetteramt warnt sechs Provinzen am 26./27. Okt. vor Starkregen","The Nation gibt die Warnung der Wetterbehörde vor heftigem Regen in sechs Provinzen über zwei Tage wieder. Reisende und Pendler sollten lokale Vorhersagen prüfen."],["气象厅警告六府10月26至27日有强降雨","泰国民族报转载气象部门警报：六府未来两天将有大雨。受影响地区的出行者和通勤者应留意当地预报。"]],
    ["NAT","2026-10-26","JOB","ASIA","https://www.nationthailand.com/business/economy/40072735",["Thailand moves to tighten oversight of platform fees amid SME concerns","The Nation reports authorities plan stricter monitoring of platform fees that small businesses have criticised. It follows the new 30/45-day payment deadlines meant to ease SME cash flow."],["Thailand will Plattformgebühren angesichts von KMU-Sorgen strenger überwachen","The Nation berichtet, die Behörden planten eine strengere Kontrolle der von kleinen Unternehmen kritisierten Plattformgebühren. Dies folgt auf die neuen Zahlungsfristen von 30/45 Tagen zur Entlastung der KMU."],["泰国拟加强对平台费用的监管，回应中小企业关切","泰国民族报报道，当局计划更严格地监测小企业批评的平台费用。此前泰国刚出台30/45天付款期限，以缓解中小企业现金流。"]],
    ["TBN","2026-10-26","JOB","ASIA","https://www.thailand-business-news.com/law/336375-thailand-orders-december-deadline-for-foreign-nominee-land-probes",["Thailand sets a December deadline for probes into foreign nominee land holdings","Thailand Business News reports a December deadline for investigations into foreign nominee land arrangements. Foreign investors, including Chinese-funded firms, may face closer scrutiny of how they hold land."],["Thailand setzt Dezember-Frist für Prüfungen ausländischer Nominee-Landbesitze","Thailand Business News meldet eine Dezember-Frist für Untersuchungen zu ausländischen Strohmann-Landbesitzen. Ausländische Investoren, auch chinesisch finanzierte Firmen, könnten genauer geprüft werden."],["泰国设定12月期限，调查外国人名义持有土地","泰国商业新闻报道，当局为调查外国人名义持地安排设定了12月期限。外国投资者（包括中资企业）的土地持有方式可能受到更严格审查。"]],
    ["TOI","2026-10-26","GP","EUR","https://www.timesofisrael.com/serbias-vucic-concedes-election-defeat-in-historic-win-for-student-protest-movement/",["Serbia: Vucic concedes a parliamentary election to the student protest movement","The Times of Israel reports Aleksandar Vucic has conceded a parliamentary election won by the student-led protest movement, which it calls historic."],["Serbien: Vucic räumt Parlamentswahl-Niederlage gegen die Studentenbewegung ein","The Times of Israel berichtet, Aleksandar Vucic habe eine Parlamentswahl eingeräumt, die von der studentisch geführten Protestbewegung gewonnen wurde; es spricht von einem historischen Sieg."],["塞尔维亚：武契奇承认议会选举败给学生抗议运动","以色列时报报道，武契奇已承认在议会选举中败给由学生领导的抗议运动，并称这是历史性胜利。"]],
    ["TOI","2026-10-26","GP","AME","https://www.timesofisrael.com/in-upset-brazils-anti-israel-incumbent-lula-defeats-flavio-bolsonaro-in-presidential-runoff/",["Brazil: Lula defeats Flávio Bolsonaro in the runoff; Bolsonaro camp alleges irregularities","The Times of Israel reports Lula won a fourth term and Bolsonaro's camp alleges voting irregularities and seeks annulment. Breitbart (25 Oct) frames the result differently, citing the extended voting time."],["Brasilien: Lula schlägt Flávio Bolsonaro in der Stichwahl; Bolsonaro-Lager nennt Unregelmäßigkeiten","The Times of Israel berichtet, Lula habe eine vierte Amtszeit gewonnen; Bolsonaros Lager behauptet Unregelmäßigkeiten und strebt eine Annullierung an. Breitbart (25. Okt.) rahmt das Ergebnis anders und verweist auf die verlängerte Wahlzeit."],["巴西：卢拉在决选中击败弗拉维奥·博尔索纳罗，博派称有违规","以色列时报报道，卢拉赢得第四个任期，博尔索纳罗阵营称投票存在违规并寻求宣布结果无效。Breitbart（10月25日）则以投票时间延长为由给出不同解读。"]],
    ["TOI","2026-10-26","ME","MEA","https://www.timesofisrael.com/liveblog-october-26-2026/",["Times of Israel live blog: CNN says Netanyahu pushed for a pre-election Iran strike","The Times of Israel relays a CNN report that Netanyahu pushed for a strike on Iran before the election and Trump refused but signalled joint action soon. The Prime Minister's Office calls the report fake news, so claims conflict."],["Times of Israel Liveblog: CNN – Netanyahu drängte auf Iran-Angriff vor der Wahl","The Times of Israel gibt einen CNN-Bericht wieder, wonach Netanyahu einen Schlag gegen Iran vor der Wahl forderte und Trump ablehnte, aber baldiges gemeinsames Handeln andeutete. Das Büro des Premiers nennt den Bericht Fake News; die Angaben widersprechen sich."],["以色列时报直播：CNN称内塔尼亚胡曾推动大选前打击伊朗","以色列时报转述CNN报道：内塔尼亚胡曾推动在大选前打击伊朗，特朗普拒绝但暗示不久后将联合行动。总理办公室称该报道为假新闻，双方说法相互矛盾。"]],
    ["CXG","2026-10-26","TEC","ASIA","https://www.caixinglobal.com/2026-10-26/general-purpose-ai-could-squeeze-out-smart-driving-specialists-industry-exec-warns-102497319.html",["Caixin: DeepRoute.ai CEO warns general-purpose AI could squeeze out smart-driving specialists","Caixin Global reports DeepRoute.ai's CEO warns that general-purpose AI may threaten specialised self-driving companies. It is one executive's view, from a company with a stake in the outcome."],["Caixin: DeepRoute.ai-Chef warnt, universelle KI könnte Spezialisten für intelligentes Fahren verdrängen","Caixin Global berichtet, der Chef von DeepRoute.ai warne, universelle KI könne spezialisierte Anbieter autonomen Fahrens bedrohen. Es ist die Sicht eines einzelnen Managers mit eigenem Interesse."],["财新：DeepRoute.ai首席执行官警告通用AI可能挤压智驾专业公司","财新全球报道，DeepRoute.ai首席执行官警告，通用AI可能威胁专业自动驾驶公司。这只是一位与结果利益相关的企业高管的观点。"]],
    ["CXG","2026-10-26","CN","ASIA","https://www.caixinglobal.com/2026-10-26/us-proposes-expanding-china-investment-controls-to-biotech-102497316.html",["US proposes extending China investment controls to biotech","Caixin Global reports a Treasury plan would bring some biotech joint ventures and equity deals under national-security review. It extends the investment-control proposal covered earlier this week."],["USA wollen China-Investitionskontrollen auf Biotechnologie ausweiten","Caixin Global berichtet, ein Plan des Finanzministeriums würde bestimmte Biotech-Joint-Ventures und Beteiligungen einer nationalen Sicherheitsprüfung unterwerfen. Er erweitert den früher gemeldeten Vorschlag."],["美国提议将对华投资管制扩大至生物科技","财新全球报道，美国财政部的一项计划将把部分生物科技合资和股权交易纳入国家安全审查，是本周早些时候所报投资管制提案的延伸。"]],
    ["BRT","2026-10-26","EU","EUR","https://www.breitbart.com/europe/2026/10/26/le-pen-invokes-joan-of-arc-as-she-launches-presidential-campaign-vowing-to-usher-in-new-french-renaissance/",["Breitbart: Le Pen invokes Joan of Arc as she launches her presidential campaign","Breitbart reports that Marine Le Pen formally opened her French presidential run before a large crowd, promising a new French ‘Renaissance’. This is the outlet's framing of the event."],["Breitbart: Le Pen beruft sich auf Jeanne d'Arc beim Start ihrer Präsidentschaftskampagne","Breitbart berichtet, Marine Le Pen habe vor großem Publikum offiziell ihre Präsidentschaftskandidatur eröffnet und eine neue französische ‚Renaissance‘ versprochen. Das ist die Darstellung des Mediums."],["Breitbart：勒庞以圣女贞德为号召启动总统竞选","Breitbart报道，玛丽娜·勒庞在大批支持者面前正式开启法国总统竞选，承诺带来法国的新“文艺复兴”。以上为该媒体的表述。"]],
